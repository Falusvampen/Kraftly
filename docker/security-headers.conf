# docker/security-headers.conf

# Content Security Policy:
# - default-src 'self': blockera externa domäner som standard
# - script-src 'self': kör endast skript från egen build
# - style-src 'self' 'unsafe-inline': tillåter inline-styles från Vue-komponenter
# - img-src 'self' data:: tillåter SVG/ikoner och data-URI:er
# - connect-src 'self': tillåter fetch mot /api/ på samma origin
# - frame-ancestors 'none': skyddar mot klickkapning
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;

# Förhindra MIME-sniffing
add_header X-Content-Type-Options "nosniff" always;

# Fallback för äldre webbläsare som saknar CSP frame-ancestors
add_header X-Frame-Options "DENY" always;

# Begränsa referrer-läckage vid cross-origin navigation
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# HSTS – tvinga HTTPS i 1 år
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;