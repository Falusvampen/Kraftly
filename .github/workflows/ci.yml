name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      use_cache:
        description: 'Use npm cache'
        type: boolean
        default: true

permissions:
  contents: read

  # Concurrency betyder samtidigt
concurrency:
  # Group är ett namn på gruppen av workflows som ska köras samtidigt. Vi använder workflow-namnet och branch-namnet för att skapa ett unikt namn per branch.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # cancel-in-progress betyder att om en ny workflow startas på samma branch, avbryts den gamla. Vi vill inte avbryta workflows på main, eftersom vi vill att de ska köra klart.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  API_KEY: ${{ secrets.VITE_API_KEY }}

jobs:
  quality:
    name: 'Code Quality (Lint, Format, Unit Tests)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache: ${{ github.event_name != 'workflow_dispatch' || inputs.use_cache == true || inputs.use_cache == 'true' }}
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:run

  build:
    name: 'Build Verification'
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache: ${{ github.event_name != 'workflow_dispatch' || inputs.use_cache == true || inputs.use_cache == 'true' }}
      - run: npm run build
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: ${{ github.ref == 'refs/heads/main' && 7 || 1 }}

  e2e:
    name: 'E2E Tests (Cypress)'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache: ${{ github.event_name != 'workflow_dispatch' || inputs.use_cache == true || inputs.use_cache == 'true' }}
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: ./.github/actions/cypress-e2e
        with:
          command: npm run e2e:ci
        env:
          E2E_SERVER: preview
          API_KEY: e2e-testnyckel
          
  release-image:
    name: 'Build Production Docker Image'
    needs: [quality, build, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t kraftly:latest .

      - name: Show Docker Image Size
        run: docker image ls kraftly:latest --format "{{.Size}}"
