name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      use_cache:
        description: 'Use npm cache'
        type: boolean
        default: true

permissions:
  contents: read

  # Concurrency betyder samtidigt
concurrency:
  # Group är ett namn på gruppen av workflows som ska köras samtidigt. Vi använder workflow-namnet och branch-namnet för att skapa ett unikt namn per branch.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # cancel-in-progress betyder att om en ny workflow startas på samma branch, avbryts den gamla. Vi vill inte avbryta workflows på main, eftersom vi vill att de ska köra klart.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  API_KEY: ${{ secrets.VITE_API_KEY }}

jobs:
  quality:
    name: 'Code Quality (Lint, Format, Unit Tests)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache: ${{ github.event_name != 'workflow_dispatch' || inputs.use_cache == true || inputs.use_cache == 'true' }}
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:run

  build:
    name: 'Build Verification'
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache: ${{ github.event_name != 'workflow_dispatch' || inputs.use_cache == true || inputs.use_cache == 'true' }}
      - run: npm run build
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: ${{ github.ref == 'refs/heads/main' && 7 || 1 }}

  e2e:
    name: 'E2E Tests (Cypress)'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache: ${{ github.event_name != 'workflow_dispatch' || inputs.use_cache == true || inputs.use_cache == 'true' }}
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: ./.github/actions/cypress-e2e
        with:
          command: npm run e2e:ci
        env:
          E2E_SERVER: preview
          API_KEY: e2e-testnyckel
          
  publish:
    name: Image → GHCR
    runs-on: ubuntu-latest
    needs: [quality, build, e2e] # bara kod som klarat testerna blir en image
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Imagenamn
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Bygg imagen
        run: docker build --build-arg GIT_SHA=${{ github.sha }} -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:main" .
      - run: docker image ls "$IMAGE" --format "{{.Repository}}:{{.Tag}}  {{.Size}}"
      - name: Logga in på GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pusha
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:main"

  deploy-staging:
    name: Deploy → staging
    runs-on: ubuntu-latest
    needs: publish
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - name: Be Render köra exakt den här imagen
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          : "${HOOK:?RENDER_DEPLOY_HOOK saknas i miljön staging}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          ENCODED=$(jq -rn --arg u "$IMAGE" '$u|@uri')
          curl -fsS -X POST "${HOOK}&imgURL=${ENCODED}"
          echo
          echo "Render har tagit emot $IMAGE"
      - name: Vänta tills staging kör den här committen
        env:
          URL: ${{ vars.STAGING_URL }}
        run: |
          : "${URL:?STAGING_URL saknas i miljön staging}"
          URL="${URL%/}"
          for i in $(seq 1 30); do
            LIVE=$(curl -fsS "$URL/version.txt" 2>/dev/null || true)
            if [ "$LIVE" = "$GITHUB_SHA" ]; then
              echo "✅ $URL kör $GITHUB_SHA"
              exit 0
            fi
            echo "Försök $i/30: staging kör ${LIVE:-(inget svar ännu)} – väntar 10 s"
            sleep 10
          done
          echo "::error::Staging kör inte $GITHUB_SHA efter 5 minuter. Kolla Events/Logs i Render."
          exit 1
      - name: Röktest – går inloggningen genom proxyn?
        env:
          URL: ${{ vars.STAGING_URL }}
        run: |
          URL="${URL%/}"
          curl -fsS -X POST "$URL/api/login" -H 'Content-Type: application/json' -d '{"email":"a@b.se","password":"x"}'
          echo
          echo "✅ /api svarar via nginx med nyckeln från Render"      
