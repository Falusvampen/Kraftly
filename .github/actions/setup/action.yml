name: 'Setup Environment'
description: 'Checkout, Node.js setup with optional cache, and dependency installation'

inputs:
  node-version:
    description: 'Node version to use'
    required: false
    default: '22'
  cache:
    description: 'Whether to cache npm dependencies'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ (inputs.cache == 'true' || inputs.cache == true) && 'npm' || '' }}

    - name: Install dependencies
      shell: bash
      run: npm ci
